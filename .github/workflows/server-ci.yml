name: server-ci

on:
  pull_request:
    paths:
      - "server/**"
      - "docs/engineering/**"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/engineering/**"
      - "docker-compose.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beyond
          POSTGRES_USER: beyond
          POSTGRES_PASSWORD: beyond_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beyond -d beyond"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://beyond:beyond_dev_only@localhost:5432/beyond
      TEST_DATABASE_URL: postgresql+asyncpg://beyond:beyond_dev_only@localhost:5432/beyond
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      OPENID_HMAC_SECRET: test-openid-hmac-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: server
        run: uv sync --group dev
      - name: Apply database migrations
        working-directory: server
        run: uv run alembic -c alembic.ini upgrade head
      - name: Verify initial SQL mirror
        run: cmp server/schema/0001_initial_schema.sql docs/engineering/database/0001_initial_schema.sql
      - name: Lint
        working-directory: server
        run: uv run ruff check .
      - name: Unit and integration tests
        working-directory: server
        run: uv run pytest
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build
      - name: Apply database migration
        run: docker compose run --rm api uv run --no-sync alembic -c alembic.ini upgrade head
      - name: Verify latest migration downgrade preserves prior layout config
        run: |
          docker compose run --rm api uv run --no-sync alembic -c alembic.ini downgrade -1
          preserved=$(docker compose exec -T postgres psql -qAt -U beyond -d beyond -c "
            SELECT COUNT(*) = 6 AND bool_and(
              config ? 'prototype_bounds'
              AND config ? 'prototype_spawn'
              AND (config->'prototype_controls') ? 'movement_speed'
              AND (config->'prototype_controls') ? 'interaction_radius'
              AND NOT ((config->'prototype_controls') ? 'position_sync_interval_ms')
            )
            FROM levels
            WHERE level_id IN (
              'LV-ROOM-01', 'LV-ROOM-02', 'LV-ROOM-03',
              'LV-ROOM-04', 'LV-ROOM-05', 'LV-HIDDEN-01'
            )
          ")
          test "$preserved" = "t"
          docker compose run --rm api uv run --no-sync alembic -c alembic.ini upgrade head
          restored=$(docker compose exec -T postgres psql -qAt -U beyond -d beyond -c "
            SELECT COUNT(*) = 6 AND bool_and(
              (config->'prototype_controls'->>'position_sync_interval_ms')::int = 120
            )
            FROM levels
            WHERE level_id IN (
              'LV-ROOM-01', 'LV-ROOM-02', 'LV-ROOM-03',
              'LV-ROOM-04', 'LV-ROOM-05', 'LV-HIDDEN-01'
            )
          ")
          test "$restored" = "t"
      - name: Check API health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health/live && curl --fail http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify RabbitMQ worker consumes a task
        run: |
          payload='{"schema_version":1,"task_id":"ci-worker-smoke","task_type":"worker.ping","idempotency_key":"ci-worker-smoke","payload":{}}'
          body=$(jq -n --arg payload "$payload" '{properties:{delivery_mode:2},routing_key:"game.tasks.v1",payload:$payload,payload_encoding:"string"}')
          response=$(curl --fail --silent --show-error \
            -u beyond:beyond_dev_only \
            -H 'content-type: application/json' \
            --data "$body" \
            http://localhost:15672/api/exchanges/%2F/amq.default/publish)
          echo "$response" | grep -q '"routed":true'
          for attempt in $(seq 1 20); do
            if docker compose logs --no-color worker | grep -q 'Accepted worker.ping task_id=ci-worker-smoke'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs worker
          exit 1
      - name: Verify transactional outbox reaches RabbitMQ worker
        run: |
          task_id=$(docker compose exec -T postgres psql -qAt -U beyond -d beyond -c "
            INSERT INTO task_outbox
              (task_type, schema_version, payload, idempotency_key)
            VALUES
              ('worker.ping', 1, '{}'::jsonb, 'ci-outbox-relay-smoke')
            RETURNING task_id
          ")
          test -n "$task_id"
          for attempt in $(seq 1 20); do
            if docker compose logs --no-color worker | grep -q "Accepted worker.ping task_id=$task_id"; then
              status=$(docker compose exec -T postgres psql -qAt -U beyond -d beyond -c "SELECT status FROM task_outbox WHERE task_id = '$task_id'")
              test "$status" = "PUBLISHED"
              exit 0
            fi
            sleep 1
          done
          docker compose logs worker
          exit 1
      - name: Stop services
        if: always()
        run: docker compose down -v
