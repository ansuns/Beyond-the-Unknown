openapi: 3.1.0
info:
  title: Beyond the Unknown Game API
  version: 1.1.0
  description: Language-agnostic REST contract for Cocos Creator 3.x TypeScript client and Python FastAPI server.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: api.example.invalid }
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Player }
  - { name: Map }
  - { name: Level }
  - { name: Discovery }
  - { name: Collection }
  - { name: Reward }
  - { name: Leaderboard }
  - { name: Archive }
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wx_code, request_id]
              properties:
                wx_code: { type: string, minLength: 1 }
                request_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeLogin' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /player/me:
    get:
      tags: [Player]
      operationId: getPlayerMe
      responses:
        '200':
          description: Current authenticated player profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
        '401': { description: Missing, invalid or expired bearer token }
  /player/characters:
    get:
      tags: [Player]
      operationId: getCharacters
      responses:
        '200':
          description: Character choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /player/character:
    put:
      tags: [Player]
      operationId: selectCharacter
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [character_id]
              properties: { character_id: { type: string } }
      responses:
        '200': { description: Selected }
        '404': { $ref: '#/components/responses/NotFound' }
  /map/enter:
    post:
      tags: [Map]
      operationId: enterMap
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Map instance assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /level:
    get:
      tags: [Level]
      operationId: listLevels
      responses:
        '200':
          description: Enabled level catalog and player-visible unlock status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /level/settle:
    post:
      tags: [Level]
      operationId: settleLevel
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: { type: string, format: uuid }
      responses:
        '200': { description: Server-validated result, completion time, discoveries and score outcome }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Required objective configuration is incomplete }
  /player/progress:
    get:
      tags: [Player]
      operationId: getPermanentProgress
      responses:
        '200': { description: Latest versioned permanent progress snapshot }
  /player/discoveries:
    get:
      tags: [Player]
      operationId: listPlayerDiscoveries
      responses:
        '200': { description: Personal discovery history }
  /player/collections:
    get:
      tags: [Player]
      operationId: listPlayerCollections
      responses:
        '200': { description: Owned codex collections }
  /world/archive:
    get:
      tags: [Discovery]
      operationId: listWorldArchive
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Server-owned first-discovery archive }
  /reward:
    get:
      tags: [Reward]
      operationId: listPlayerRewards
      responses:
        '200': { description: Pending claim and owned rewards }
  /reward/claim:
    post:
      tags: [Reward]
      operationId: claimReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_reward_id]
              properties: { player_reward_id: { type: string, format: uuid } }
      responses:
        '200': { description: Idempotent reward claim result }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /leaderboard:
    get:
      tags: [Leaderboard]
      operationId: getLeaderboard
      parameters:
        - { name: board_type, in: query, schema: { type: string, enum: [EXPLORE, CLEAR, COLLECT], default: EXPLORE } }
        - { name: period_type, in: query, schema: { type: string, enum: [WEEKLY, MONTHLY], default: WEEKLY } }
        - { name: scope, in: query, schema: { type: string, enum: [TOP, AROUND, SELF], default: TOP } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Period-scoped immutable score snapshot view }
  /level/enter:
    post:
      tags: [Level]
      operationId: enterLevel
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_id, entrance_id]
              properties:
                level_id: { type: string, maxLength: 64 }
                entrance_id: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Personal run created or idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
        '403': { description: Hidden or locked level }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /level/start:
    post:
      tags: [Level]
      operationId: startLevel
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties: { run_id: { type: string, format: uuid } }
      responses:
        '200': { description: Run transitioned to RUNNING (idempotent) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /level/abandon:
    post:
      tags: [Level]
      operationId: abandonLevel
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties: { run_id: { type: string, format: uuid } }
      responses:
        '200': { description: Run transitioned to ABANDONED (idempotent) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /level/rules:
    get:
      tags: [Level]
      operationId: listPlayerRules
      responses:
        '200': { description: Player-owned rule permissions and server configuration status }
  /level/rule/cast:
    post:
      tags: [Level]
      operationId: castRule
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, rule_id]
              properties:
                run_id: { type: string, format: uuid }
                rule_id: { type: string, enum: [RULE_ECHO, RULE_GAZE, RULE_REVERSE] }
                target_id: { type: [string, 'null'] }
                target_point:
                  oneOf:
                    - type: object
                      required: [x, y]
                      properties: { x: { type: number }, y: { type: number } }
                    - type: 'null'
      responses:
        '200': { description: Authoritative rule result and any matched preset combo }
        '403': { description: Rule is not unlocked }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid or out-of-scope target }
        '503': { description: Rule tuning or target configuration is incomplete }
  /level/rule/stop:
    post:
      tags: [Level]
      operationId: stopGaze
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties: { run_id: { type: string, format: uuid } }
      responses:
        '200': { description: Stops the caller's active gaze effect }
        '404': { $ref: '#/components/responses/NotFound' }
  /level/rule/maintain:
    post:
      tags: [Level]
      operationId: maintainGaze
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, target_id]
              properties:
                run_id: { type: string, format: uuid }
                target_id: { type: string }
      responses:
        '200': { description: Refreshes the server-side gaze lease }
        '409': { $ref: '#/components/responses/Conflict' }
  /level/state/{run_id}:
    get:
      tags: [Level]
      operationId: getPersonalLevelState
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Caller-owned authoritative mechanism states }
        '404': { $ref: '#/components/responses/NotFound' }
  /level/settle:
    post:
      tags: [Level]
      operationId: settleLevel
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties: { run_id: { type: string, format: uuid } }
      responses:
        '200':
          description: Idempotent settlement result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
        '409': { $ref: '#/components/responses/Conflict' }
  /discovery:
    get:
      tags: [Discovery]
      operationId: listDiscoveries
      responses:
        '200':
          description: Current player's discoveries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /collection:
    get:
      tags: [Collection]
      operationId: listCollections
      responses:
        '200':
          description: Current player's collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /reward:
    get:
      tags: [Reward]
      operationId: listRewards
      responses:
        '200':
          description: Owned and claimable rewards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /reward/claim:
    post:
      tags: [Reward]
      operationId: claimReward
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_reward_id]
              properties: { player_reward_id: { type: string, format: uuid } }
      responses:
        '200': { description: Claimed (idempotent) }
        '409': { $ref: '#/components/responses/Conflict' }
  /leaderboard/{type}:
    get:
      tags: [Leaderboard]
      operationId: getLeaderboard
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [EXPLORE, CLEAR, COLLECT] }
        - name: season_id
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [top, around, self], default: top }
      responses:
        '200':
          description: Leaderboard page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /season:
    get:
      tags: [Leaderboard]
      operationId: getCurrentSeasons
      responses:
        '200': { description: Current weekly and monthly periods }
  /world-archive:
    get:
      tags: [Archive]
      operationId: listWorldArchive
      responses:
        '200':
          description: Global first-discovery archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeObject' }
  /internal/seasons/{season_id}/review:
    post:
      tags: [Internal Operations]
      operationId: reviewSeasonSettlement
      parameters:
        - name: season_id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - name: X-Internal-API-Key
          in: header
          required: true
          schema: { type: string }
        - name: X-Reviewer-Id
          in: header
          required: false
          schema: { type: string, maxLength: 96 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 512 }
      responses:
        '200': { description: Season review decision and idempotent cosmetic rank rewards }
        '401': { description: Invalid internal API key }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Season is not in review }
        '503': { description: Internal review key is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per business operation; reuse unchanged for retries. Never substitute X-Request-Id.
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    EnvelopeLogin:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        request_id: { type: string }
        data:
          type: object
          required: [access_token, token_type, expires_in, player_id, is_new_player, progress_version, server_time]
          properties:
            access_token: { type: string }
            token_type: { type: string, enum: [Bearer] }
            expires_in: { type: integer }
            player_id: { type: string, format: uuid }
            character_id: { type: [string, 'null'] }
            is_new_player: { type: boolean }
            progress_version: { type: integer, minimum: 0 }
            server_time: { type: integer, description: Unix epoch seconds }
    EnvelopeObject:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { type: object, additionalProperties: true }
        request_id: { type: string }
  responses:
    BadRequest:
      description: Invalid request
    NotFound:
      description: Resource not found or not owned
    Conflict:
      description: State conflict or idempotency key reused with a different payload
