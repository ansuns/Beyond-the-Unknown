[project]
name = "beyond-the-unknown-server"
version = "0.1.0"
description = "FastAPI backend for Beyond the Unknown"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.15,<2.0",
  "aio-pika>=9.5,<10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
