services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beyond
      POSTGRES_USER: beyond
      POSTGRES_PASSWORD: beyond_dev_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyond -d beyond"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: beyond
      RABBITMQ_DEFAULT_PASS: beyond_dev_only
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://beyond:beyond_dev_only@postgres:5432/beyond
      RABBITMQ_URL: amqp://beyond:beyond_dev_only@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      OPENID_HMAC_SECRET: ${OPENID_HMAC_SECRET:-local-development-openid-hmac-change-before-deploy}
      MAP_INSTANCE_MAX_PLAYERS: ${MAP_INSTANCE_MAX_PLAYERS:-20}
      MAP_RECONNECT_GRACE_SECONDS: ${MAP_RECONNECT_GRACE_SECONDS:-60}
      MAP_MAX_SPEED: ${MAP_MAX_SPEED:-160}
      MAP_MOVE_RATE_HZ: ${MAP_MOVE_RATE_HZ:-10}
      MAP_ACTION_RATE_LIMIT: ${MAP_ACTION_RATE_LIMIT:-5}
      MAP_ACTION_WINDOW_SECONDS: ${MAP_ACTION_WINDOW_SECONDS:-10}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-UTC}
      SEASON_REVIEW_WINDOW_SECONDS: ${SEASON_REVIEW_WINDOW_SECONDS:-600}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://beyond:beyond_dev_only@postgres:5432/beyond
      RABBITMQ_URL: amqp://beyond:beyond_dev_only@rabbitmq:5672/
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-UTC}
      SEASON_REVIEW_WINDOW_SECONDS: ${SEASON_REVIEW_WINDOW_SECONDS:-600}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-5000}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.task_worker"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
